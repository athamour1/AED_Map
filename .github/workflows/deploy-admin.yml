name: Deploy Admin

# Unlike deploy-public.yml (still targeting GitHub Pages as an interim
# measure), the admin app can only ever be served from the self-hosted VPS —
# it needs nginx's /admin/ path-routing to share an origin with the API.
# Runs after CI passes; gated behind DEPLOY_ENABLED same as deploy-api.yml so
# it's a no-op until the VPS exists.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin app
        run: pnpm --filter aed-map-admin build

      - name: Sync to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: apps/admin/dist/spa/
          remote_path: ${{ secrets.ADMIN_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
