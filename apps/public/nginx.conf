# Serves this container's own build output only. The gateway nginx
# (infra/nginx.conf) reverse-proxies here for every path it doesn't route
# elsewhere — this config has no opinion about /admin/ or /api/.
#
# Production concerns live here, next to the files they describe: cache
# lifetimes, compression and browser security headers. TLS/HSTS belong to
# the front-of-chain reverse proxy that terminates HTTPS.

# How long the browser may keep each kind of file.
#   hashed build output (assets/, workbox-<hash>.js) → forever, never changes
#   sw.js / manifest / index.html / SPA routes      → revalidate every load,
#     otherwise clients keep running the previous release after a deploy
#   icons                                           → a week
# Keyed on status too: a 404 for a missing asset must not be cached for a
# year (map is evaluated when headers are sent, so $status is known).
map "$status $uri" $public_cache_control {
    ~^(200|304)\ /assets/                 "public, max-age=31536000, immutable";
    ~^(200|304)\ /workbox-[0-9a-f]+\.js$  "public, max-age=31536000, immutable";
    ~^(200|304)\ /icons/                  "public, max-age=604800";
    "200 /favicon.ico"                    "public, max-age=604800";
    "304 /favicon.ico"                    "public, max-age=604800";
    default                               "no-cache";
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Declared once at server level: an add_header inside a location would
    # silently drop every one of these for that location.
    add_header Cache-Control $public_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The build has no inline scripts; Quasar/Leaflet set inline styles.
    # OSM tiles are images, and the service worker fetches them too (connect-src).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # A missing build file is a real 404 — never the SPA shell, which the
    # browser would then try to run as JavaScript/CSS.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
