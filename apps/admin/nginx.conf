# Serves this container's own build output only. The gateway nginx
# (infra/nginx.conf) forwards the original request URI unchanged (no path
# rewriting), so requests still arrive here with the /admin/ prefix — which
# matches this app's build-time publicPath/router base (quasar.config.js).

server {
    listen 80;

    # Hashed build assets never change under the same name: cache for good.
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (index.html, the SPA fallback) must be revalidated on
    # every load. Without a Cache-Control header browsers cache it
    # heuristically from Last-Modified, and keep booting the previous build
    # after a deploy.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }
}
