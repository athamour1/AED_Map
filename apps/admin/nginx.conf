# Serves this container's own build output only. The gateway nginx
# (infra/nginx.conf) forwards the original request URI unchanged (no path
# rewriting), so requests still arrive here with the /admin/ prefix — which
# matches this app's build-time publicPath/router base (quasar.config.js).
#
# Production concerns live here, next to the files they describe: cache
# lifetimes, compression and browser security headers. TLS/HSTS belong to
# the front-of-chain reverse proxy that terminates HTTPS.

# Hashed build assets never change under the same name: cache for good.
# Everything else (index.html, SPA routes) is revalidated on every load —
# without a Cache-Control header browsers cache it heuristically from
# Last-Modified and keep booting the previous build after a deploy.
# Keyed on status too: a 404 for a missing asset must not be cached for a
# year (map is evaluated when headers are sent, so $status is known).
map "$status $uri" $admin_cache_control {
    ~^(200|304)\ /admin/assets/  "public, max-age=31536000, immutable";
    default                      "no-cache";
}

server {
    listen 80;
    server_tokens off;
    # The build lives at <root>/admin/, matching the URI prefix, so plain
    # `root` maps it (no `alias`, whose interplay with try_files is buggy).
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Declared once at server level: an add_header inside a location would
    # silently drop every one of these for that location.
    add_header Cache-Control $admin_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Private panel: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The build has no inline scripts; Quasar/Leaflet set inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # A missing build file is a real 404 — never the SPA shell, which the
    # browser would then try to run as JavaScript/CSS.
    location /admin/assets/ {
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}
