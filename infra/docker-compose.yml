services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ghcr.io/athamour1/aed-map/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # One-time bootstrap: imports the original aed-locations.json into a fresh
  # database. Not part of the normal service lifecycle (no `depends_on` from
  # `api`, gated behind a profile so `docker compose up` never runs it).
  # Uses the `build` stage directly since it still has the dev tooling (tsx)
  # that the lean production image intentionally excludes. Run explicitly:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ['seed']
    command: ['pnpm', '--filter', 'aed-map-api', 'run', 'db:seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ${API_IMAGE:-ghcr.io/athamour1/aed-map/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  # apps/public builds and serves itself — the image's last layer is nginx
  # with the built PWA baked in (apps/public/Dockerfile). Not published on
  # the host; the gateway `nginx` service below reverse-proxies to it.
  public:
    build:
      context: ..
      dockerfile: apps/public/Dockerfile
    restart: unless-stopped
    expose:
      - '80'

  # Same idea as public, for apps/admin.
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    expose:
      - '80'

  # Gateway: plain HTTP on 8080 — no TLS/certbot here. Put this behind
  # whatever reverse proxy you already run to terminate TLS on the real
  # domain and forward to this port. Purely a reverse proxy — path-routes
  # to the public/admin/api containers, which each serve their own content.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      public:
        condition: service_started
      admin:
        condition: service_started

volumes:
  postgres_data:
