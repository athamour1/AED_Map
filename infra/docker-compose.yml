services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ghcr.io/athamour1/aed-map/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # One-time bootstrap: imports the original aed-locations.json into a fresh
  # database. Not part of the normal service lifecycle (no `depends_on` from
  # `api`, gated behind a profile so `docker compose up` never runs it).
  # Uses the `build` stage directly since it still has the dev tooling (tsx)
  # that the lean production image intentionally excludes. Run explicitly:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ['seed']
    command: ['pnpm', '--filter', 'aed-map-api', 'run', 'db:seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ${API_IMAGE:-ghcr.io/athamour1/aed-map/api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  # One-shot: builds apps/public and copies the static output into a shared
  # volume for nginx to serve. Re-running `docker compose up` after a source
  # change rebuilds this image and re-syncs the volume — no host bind-mount,
  # no separate rsync-to-VPS step needed.
  public-assets:
    build:
      context: ..
      dockerfile: apps/public/Dockerfile
    volumes:
      - public_dist:/output

  # Same idea as public-assets, for apps/admin.
  admin-assets:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    volumes:
      - admin_dist:/output

  # Plain HTTP on 8080 — no TLS/certbot here. Put this behind whatever
  # reverse proxy you already run to terminate TLS on the real domain and
  # forward to this port.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_dist:/srv/public:ro
      - admin_dist:/srv/admin:ro
    depends_on:
      api:
        condition: service_started
      public-assets:
        condition: service_completed_successfully
      admin-assets:
        condition: service_completed_successfully

volumes:
  postgres_data:
  public_dist:
  admin_dist:
