# AED Map — single-origin, path-based routing (see plan §1/§7).
#   /       -> apps/public container (nginx serving its own PWA build)
#   /admin/ -> apps/admin container  (nginx serving its own SPA build)
#   /api/   -> apps/api (NestJS), proxied
#
# This gateway does no static file serving of its own — each app container
# serves its own build and sets its own cache/security headers (see
# apps/public/nginx.conf, apps/admin/nginx.conf); this just path-routes.
#
# Plain HTTP only, on port 8080 (see infra/docker-compose.yml). No TLS/certs
# here — this is meant to sit behind whatever reverse proxy the user already
# runs (Caddy, nginx, Traefik, a managed load balancer, etc.), which owns the
# real domain and terminates TLS (and sets HSTS), then forwards to this
# container on 8080.

# ── Real client IP ───────────────────────────────────────────────────────
# Requests arrive from the front-of-chain proxy, so $remote_addr is the
# proxy's address. Trust X-Forwarded-For from private/loopback addresses
# only (where that proxy and Docker live) and walk back to the first
# untrusted hop: that is the client. Rate limiting and logs below then see
# real visitors, not one shared proxy IP. If your proxy runs on a public
# address, add it here.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Rate limits ──────────────────────────────────────────────────────────
# Credential endpoints: slow down password guessing per client IP.
limit_req_zone $binary_remote_addr zone=aed_auth:10m rate=10r/m;
# Whole API: generous ceiling against floods, never felt by real use.
limit_req_zone $binary_remote_addr zone=aed_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # The API takes small JSON bodies only.
    client_max_body_size 1m;

    # nginx's own trailing-slash redirects (e.g. /admin -> /admin/, /api ->
    # /api/, triggered because "/admin" and "/api" are one character short of
    # matching their proxy_pass locations below) build the Location header
    # from $server_port, which inside this container is always 80 — the
    # external Docker port mapping (8080, or whatever the front-of-chain
    # reverse proxy uses) is invisible to it. That drops the real port,
    # sending clients to a port nothing listens on. Relative redirects sidestep
    # this: the browser resolves them against the URL it actually used.
    absolute_redirect off;

    # Shared by every proxied location (inherited because no location below
    # sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Trust the scheme the front-of-chain reverse proxy reports rather
    # than $scheme, which would always be "http" at this internal hop.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Liveness for the compose healthcheck / uptime monitors.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public map — proxied to the public container, no path rewriting (its
    # own nginx.conf expects requests exactly as the browser sent them).
    location / {
        proxy_pass http://public:80;
    }

    # Admin panel — proxied to the admin container. Also no path rewriting:
    # the admin build's publicPath/router base is '/admin/', so its own
    # nginx.conf expects the /admin/ prefix to still be present.
    location /admin/ {
        proxy_pass http://admin:80;
    }

    # Backend API — same origin as both frontends above, so no CORS is needed.
    # JSON is compressed here since Nest doesn't compress its own responses.
    location /api/ {
        limit_req zone=aed_api burst=40 nodelay;
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        proxy_pass http://api:3000/api/;
    }

    # Password and invite-token endpoints get the strict per-IP limit.
    location ~ ^/api/auth/(login|accept-invite)$ {
        limit_req zone=aed_auth burst=5 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        proxy_pass http://api:3000;
    }
}
