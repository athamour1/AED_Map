# AED Map — single-origin, path-based routing (see plan §1/§7).
#   /       -> apps/public static build (no auth)
#   /admin/ -> apps/admin static build  (JWT auth)
#   /api/   -> apps/api (NestJS), proxied
#
# Plain HTTP only, on port 8080 (see infra/docker-compose.yml). No TLS/certs
# here — this is meant to sit behind whatever reverse proxy the user already
# runs (Caddy, nginx, Traefik, a managed load balancer, etc.), which owns the
# real domain and terminates TLS, then forwards to this container on 8080.

server {
    listen 80;
    server_name your-domain.example;

    # Public map — static SPA, no auth.
    location / {
        root /srv/public;
        try_files $uri $uri/ /index.html;
    }

    # Admin panel — static SPA, JWT auth handled client-side.
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Backend API — same origin as both frontends above, so no CORS is needed.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the scheme the front-of-chain reverse proxy reports rather
        # than $scheme, which would always be "http" at this internal hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
