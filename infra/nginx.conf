# AED Map — single-origin, path-based routing (see plan §1/§7).
#   /       -> apps/public container (nginx serving its own PWA build)
#   /admin/ -> apps/admin container  (nginx serving its own SPA build)
#   /api/   -> apps/api (NestJS), proxied
#
# This gateway does no static file serving of its own — each app container
# serves its own build (see apps/public/Dockerfile, apps/admin/Dockerfile,
# apps/public/nginx.conf, apps/admin/nginx.conf); this just path-routes.
#
# Plain HTTP only, on port 8080 (see infra/docker-compose.yml). No TLS/certs
# here — this is meant to sit behind whatever reverse proxy the user already
# runs (Caddy, nginx, Traefik, a managed load balancer, etc.), which owns the
# real domain and terminates TLS, then forwards to this container on 8080.

server {
    listen 80;
    server_name your-domain.example;

    # Public map — proxied to the public container, no path rewriting (its
    # own nginx.conf expects requests exactly as the browser sent them).
    location / {
        proxy_pass http://public:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Admin panel — proxied to the admin container. Also no path rewriting:
    # the admin build's publicPath/router base is '/admin/', so its own
    # nginx.conf expects the /admin/ prefix to still be present.
    location /admin/ {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend API — same origin as both frontends above, so no CORS is needed.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the scheme the front-of-chain reverse proxy reports rather
        # than $scheme, which would always be "http" at this internal hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
